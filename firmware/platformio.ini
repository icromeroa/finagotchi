; FinaGotchi firmware — ESP32-S3 SuperMini + ILI9225 240x320
; Plataforma: PlatformIO (VS Code). Ver README.md en esta carpeta.

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Documentacion: https://docs.platformio.org/en/latest/platforms/espressif32.html
; Placa SuperMini 16 MB Flash + PSRAM (N16R8): usar high flash + octal PSRAM si esta disponible
board_build.flash_mode = qio
board_build.psram_type = octal
board_build.psram = octal

; Cableado real de la placa (ver docs/FIRMWARE.md):
;   VCC -> 3V3, GND -> GND
;   SCL (SCK) Pin 2  -> GP2
;   SDA (MOSI) Pin 13 -> GP13
;   RES (RST) Pin 5  -> GP5
;   DC Pin 6         -> GP6
;   CS -> GP7 (antes GND). U8g2 debe manejar CS por software;
;   si lo dejás en GND, el pin peleará contra GND y se cortocircuita.
board_build.f_cpu = 240000000L
upload_speed = 921600

monitor_speed = 115200

; Cableado real de la placa (ver docs/FIRMWARE.md):
;   VCC -> 3V3, GND -> GND
;   SCL (SCK) Pin 2  -> GP2
;   SDA (MOSI) Pin 13 -> GP13
;   RES (RST) Pin 5  -> GP5
;   DC Pin 6         -> GP6
;   CS -> GP7 (antes GND: con U8g2 debe ser GPIO para que pueda manejarlo)
build_flags =
    -DU8G2_ILI9225
    -DFAST_SPI_FREQUENCY=10000000

lib_ldf_mode = deep
lib_deps =
    olikraus/U8g2@^2.36.0

; El firmware levanta el monitor serie a 115200 para depuracion
build_src_filter = +<*>
