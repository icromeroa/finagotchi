; FinaGotchi firmware — ESP32-S3 SuperMini + ILI9225 240x320
; Plataforma: PlatformIO (VS Code). Ver README.md en esta carpeta.

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Documentacion: https://docs.platformio.org/en/latest/platforms/espressif32.html
; Placa detectada: 4 MB Flash, sin PSRAM (log: Detected size 4096k < header 8192k).
; Compilar para 8/16 MB o activar PSRAM hace abortar en init_flash.
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = default.csv

; Cableado real de la placa (ver docs/FIRMWARE.md):
;   VCC -> 3V3, GND -> GND
;   SCL (SCK) Pin 2  -> GP2
;   SDA (MOSI) Pin 13 -> GP13
;   RES (RST) Pin 5  -> GP5
;   DC Pin 6         -> GP6
;   CS -> GND (fisico): LovyanGFX lo deja en -1 (sin pin)
board_build.f_cpu = 240000000L
upload_speed = 921600

monitor_speed = 115200

lib_ldf_mode = deep
lib_deps =
    lovyan03/LovyanGFX@^1.1.20

; El firmware levanta el monitor serie a 115200 para depuracion
build_src_filter = +<*>
