; FinaGotchi firmware — ESP32-S3 SuperMini + ILI9225 240x320
; Plataforma: PlatformIO (VS Code). Ver README.md en esta carpeta.

[env:esp32-s3]
platform = espressif32@5.4.0
board = esp32-s3-devkitc-1
framework = arduino

; Documentacion: https://docs.platformio.org/en/latest/platforms/espressif32.html
; Placa SuperMini 16 MB Flash + PSRAM (N16R8): usar high flash + octal PSRAM si esta disponible
board_build.flash_mode = qio
board_build.psram_type = octal
board_build.psram = octal

; SPI propio de la pantalla (ver docs/FIRMWARE.md):
;   Pin 2/GP2 = SCLK, Pin 13/GP13 = MOSI, Pin 6/GP6 = DC, Pin 5/GP5 = RST, CS a GND (-1)
board_build.f_cpu = 240000000L
upload_speed = 921600

monitor_speed = 115200

; Cableado real de la placa (ver docs/FIRMWARE.md):
;   VCC -> 3V3, GND -> GND
;   SCL (SCK) Pin 2  -> GP2
;   SDA (MOSI) Pin 13 -> GP13
;   RES (RST) Pin 5  -> GP5
;   DC Pin 6         -> GP6
;   CS -> GND (fisico, sin pin) => TFT_CS=-1
build_flags =
    -DTFT_ESPI_USER_SETUP_LOADED
    -DILI9225_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=2
    -DTFT_CS=-1
    -DTFT_DC=6
    -DTFT_RST=5
    -DTFT_BL=-1
    -DTOUCH_NOT_IMPLEMENTED
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=10000000
    -DSPI_TOUCH_FREQUENCY=10000000

lib_ldf_mode = deep
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#2.7.10

; El firmware levanta el monitor serie a 115200 para depuracion
build_src_filter = +<*>
